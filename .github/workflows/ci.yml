          ssh-keyscan -p 2222 127.0.0.1 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

          FREESCP_IT_JUMP_HOST=127.0.0.1 \
          FREESCP_IT_JUMP_PORT=2222 \
          FREESCP_IT_JUMP_USER=freescp_it \
          FREESCP_IT_JUMP_KEY=/tmp/freescp_it_linux_ed25519 \
          cargo test -p freescp-core --test sftp_integration

      - name: Test (Linux, remaining suites self-skip without env)
        if: runner.os == 'Linux'
        # FTP/FTPS/WebDAV suites print [SKIP] and pass unless their own
        # FREESCP_IT_* vars are set; running them here exercises the skip path.
        run: |
          for suite in ftp_integration ftps_integration webdav_integration smb_integration; do
            if [[ -f "crates/freescp-core/tests/${suite}.rs" ]]; then
              cargo test -p freescp-core --test "$suite"
            else
              echo "crates/freescp-core/tests/${suite}.rs not written yet (sibling workstream); skipping"
            fi
          done

