          IT_TELNET_PORT=12323 \
          IT_TELNET_USER=freescp_it \
          IT_TELNET_PASS=freescp_it_pass \
          python3 /tmp/freescp_telnet_server.py &
          TELNET_PID=$!
          trap 'kill "$TELNET_PID" 2>/dev/null || true; wait "$TELNET_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if nc -z 127.0.0.1 12323 >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if ! nc -z 127.0.0.1 12323 >/dev/null 2>&1; then
            echo "telnet integration server did not start"
