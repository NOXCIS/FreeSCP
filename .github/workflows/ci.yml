            echo "crates/freescp-core/tests/sftp_integration.rs not written yet (sibling workstream); skipping"
            exit 0
          fi
          set -euo pipefail
          RUNNER_USER="$(whoami)"

          ssh \
            -i /tmp/freescp_it_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -N -D 127.0.0.1:1081 \
            -p 2222 "${RUNNER_USER}@127.0.0.1" &
          SOCKS_PID=$!
          trap 'kill "$SOCKS_PID" 2>/dev/null || true; wait "$SOCKS_PID" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if nc -z 127.0.0.1 1081 >/dev/null 2>&1; then
