# CI for the Rust rewrite of FreeSCP (Cargo workspace at the repo root,
# members: crates/freescp-core, crates/freescp-app).
#
# Intent mirrors the legacy C++ ci.yml:
#   - push to `dev`:        fast Linux build + fmt/clippy + non-integration tests
#   - PR to `main`:         Linux + macOS integration gate (build, unit tests,
#                           then SFTP/SCP integration against a temporary SSH
#                           server, including SOCKS5/HTTP-CONNECT proxy and
#                           SSH jump-host transport variants)
#   - both:                 website CSP guard (scripts/check_website_csp.py),
#                           no Rust toolchain needed
#
# Integration test env contract: the suites in crates/freescp-core/tests/ self-
# skip (print [SKIP] and pass) unless their FREESCP_IT_* env vars are set.
# Full contract: docs/PARITY.md. Suites owned by sibling
# workstreams may not be written yet; steps guard on the test file existing so
# the workflow degrades gracefully while the rewrite is in flight.

name: CI (Dev Quick + Main Integration, Rust)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website-csp:
    # Guards the hand-written site in website/: its only <script> is a JSON-LD
    # data block, so website/_headers can keep the strict `script-src 'none'`
    # without any SHA-256 hash to maintain. Fails if an executable script is
    # added without widening the policy deliberately.
    name: Website CSP Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check website ships no executable scripts
        run: python3 scripts/check_website_csp.py

  quick-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    name: Quick Checks (push to dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Slint + backends)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test freescp-core (unit + mock; integration suites self-skip)
        run: cargo test -p freescp-core --tests

      - name: Build workspace
        run: cargo build --workspace

  pr-main-integration:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: Integration Gate (PR to main only)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies (Slint + backends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        # The Rust stack is pure Rust (russh, suppaftp, reqwest+rustls, Slint);
        # macOS runners already ship the SSH server and code-signing tooling
        # used by the integration steps below, so nothing needs installing.
        run: echo "No extra dependencies needed on macOS for the Rust build"

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace

      - name: Test freescp-core (unit + mock; integration suites self-skip)
        run: cargo test -p freescp-core

      - name: Setup Linux SFTP/SCP integration server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd
          sudo ssh-keygen -A

          sudo useradd --create-home --shell /bin/bash freescp_it || true
          # Ubuntu images may leave service users locked; unlock for pubkey auth.
          sudo usermod -U freescp_it || true
          sudo passwd -d freescp_it || true
          sudo chage -E -1 freescp_it || true
          ssh-keygen -t ed25519 -N "" -f /tmp/freescp_it_linux_ed25519 -q
          sudo install -d -o freescp_it -g freescp_it -m 700 /home/freescp_it/.ssh
          sudo install -o freescp_it -g freescp_it -m 600 /tmp/freescp_it_linux_ed25519.pub /home/freescp_it/.ssh/authorized_keys
          sudo install -d -o freescp_it -g freescp_it -m 700 /home/freescp_it/upload

          cat > /tmp/freescp_sshd_config <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          Protocol 2
          HostKey /etc/ssh/ssh_host_ed25519_key
          HostKey /etc/ssh/ssh_host_rsa_key
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          AllowUsers freescp_it
          AuthorizedKeysFile .ssh/authorized_keys
          Subsystem sftp internal-sftp
          PidFile /tmp/freescp_sshd.pid
          LogLevel VERBOSE
          PrintMotd no
          UseDNS no
          EOF

          if ! sudo /usr/sbin/sshd -t -f /tmp/freescp_sshd_config; then
            echo "Invalid sshd config"
            sudo cat /tmp/freescp_sshd.log || true
            exit 1
          fi

          if ! sudo /usr/sbin/sshd -f /tmp/freescp_sshd_config -E /tmp/freescp_sshd.log; then
            echo "Failed to start sshd"
            sudo cat /tmp/freescp_sshd.log || true
            exit 1
          fi

          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
              echo "SFTP integration server is ready"
              break
            fi
            sleep 1
          done

          if ! (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
            echo "SFTP integration server did not start"
            sudo cat /tmp/freescp_sshd.log || true
            exit 1
          fi

          if ! ssh \
            -i /tmp/freescp_it_linux_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p 2222 \
            freescp_it@127.0.0.1 true; then
            echo "SFTP auth smoke test failed"
            sudo cat /tmp/freescp_sshd.log || true
            exit 1
          fi

      - name: Setup macOS SFTP/SCP integration server
        if: runner.os == 'macOS'
        run: |
          RUNNER_USER="$(whoami)"
          sudo ssh-keygen -A

          ssh-keygen -t ed25519 -N "" -f /tmp/freescp_it_ed25519 -q
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat /tmp/freescp_it_ed25519.pub > "$HOME/.ssh/freescp_it_authorized_keys"
          chmod 600 "$HOME/.ssh/freescp_it_authorized_keys"

          mkdir -p /tmp/freescp-it-upload
          chmod 700 /tmp/freescp-it-upload

          cat > /tmp/freescp_sshd_mac_config <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          Protocol 2
          HostKey /etc/ssh/ssh_host_ed25519_key
          HostKey /etc/ssh/ssh_host_rsa_key
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          AllowUsers ${RUNNER_USER}
          AuthorizedKeysFile .ssh/freescp_it_authorized_keys
          Subsystem sftp internal-sftp
          PidFile /tmp/freescp_sshd_mac.pid
          LogLevel VERBOSE
          UseDNS no
          EOF

          sudo /usr/sbin/sshd -f /tmp/freescp_sshd_mac_config -E /tmp/freescp_sshd_mac.log

          for i in {1..20}; do
            if nc -z 127.0.0.1 2222 >/dev/null 2>&1; then
              echo "SFTP integration server is ready"
              break
            fi
            sleep 1
          done

          if ! nc -z 127.0.0.1 2222 >/dev/null 2>&1; then
            echo "SFTP integration server did not start"
            sudo cat /tmp/freescp_sshd_mac.log || true
            exit 1
          fi

      - name: Test (Linux, SFTP integration)
        if: runner.os == 'Linux'
        env:
          FREESCP_IT_SFTP_HOST: 127.0.0.1
          FREESCP_IT_SFTP_PORT: "2222"
          FREESCP_IT_SFTP_USER: freescp_it
          FREESCP_IT_SFTP_KEY: /tmp/freescp_it_linux_ed25519
          FREESCP_IT_REMOTE_BASE: /home/freescp_it/upload
        run: |
          if [[ -f crates/freescp-core/tests/sftp_integration.rs ]]; then
            cargo test -p freescp-core --test sftp_integration
          else
            echo "crates/freescp-core/tests/sftp_integration.rs not written yet (sibling workstream); skipping"
          fi

      - name: Test (Linux, SCP integration)
        if: runner.os == 'Linux'
        env:
          FREESCP_IT_SFTP_HOST: 127.0.0.1
          FREESCP_IT_SFTP_PORT: "2222"
          FREESCP_IT_SFTP_USER: freescp_it
          FREESCP_IT_SFTP_KEY: /tmp/freescp_it_linux_ed25519
          FREESCP_IT_REMOTE_BASE: /home/freescp_it/upload
        run: |
          if [[ -f crates/freescp-core/tests/scp_integration.rs ]]; then
            cargo test -p freescp-core --test scp_integration
          else
            echo "crates/freescp-core/tests/scp_integration.rs not written yet (sibling workstream); skipping"
          fi

      - name: Write HTTP CONNECT proxy helper
        run: |
          cat > /tmp/freescp_http_connect_proxy.py <<'PY'
          import base64
          import os
          import select
          import socket
          import threading

          BIND_HOST = "127.0.0.1"
          BIND_PORT = int(os.environ["IT_HTTP_PROXY_PORT"])
          AUTH_USER = os.environ.get("IT_HTTP_PROXY_USER", "")
          AUTH_PASS = os.environ.get("IT_HTTP_PROXY_PASS", "")
          EXPECTED_AUTH = "Basic " + base64.b64encode(
              f"{AUTH_USER}:{AUTH_PASS}".encode("utf-8")
          ).decode("ascii")


          def parse_authority(authority: str):
              if authority.startswith("["):
                  end = authority.find("]")
                  if end <= 0:
                      raise ValueError("invalid IPv6 authority")
                  host = authority[1:end]
                  rest = authority[end + 1 :]
                  if not rest.startswith(":"):
                      raise ValueError("missing port")
                  return host, int(rest[1:])
              host, port = authority.rsplit(":", 1)
              return host, int(port)


          def tunnel(client: socket.socket, upstream: socket.socket):
              sockets = [client, upstream]
              while True:
                  readable, _, _ = select.select(sockets, [], [], 30.0)
                  if not readable:
                      continue
                  for src in readable:
                      data = src.recv(65536)
                      if not data:
                          return
                      dst = upstream if src is client else client
                      dst.sendall(data)


          def handle(client: socket.socket):
              upstream = None
              try:
                  client.settimeout(10.0)
                  reader = client.makefile("rb")
                  request_line = reader.readline(8192).decode(
                      "iso-8859-1", errors="replace"
                  ).strip()
                  if not request_line:
                      return
                  parts = request_line.split()
                  if len(parts) < 3 or parts[0].upper() != "CONNECT":
                      client.sendall(
                          b"HTTP/1.1 405 Method Not Allowed\r\nConnection: close\r\n\r\n"
                      )
                      return
                  authority = parts[1]
                  headers = {}
                  while True:
                      line = reader.readline(8192)
                      if not line or line in (b"\r\n", b"\n"):
                          break
                      decoded = line.decode("iso-8859-1", errors="replace").strip()
                      if not decoded or ":" not in decoded:
                          continue
                      key, value = decoded.split(":", 1)
                      headers[key.strip().lower()] = value.strip()
                  if headers.get("proxy-authorization", "") != EXPECTED_AUTH:
                      client.sendall(
                          b"HTTP/1.1 407 Proxy Authentication Required\r\n"
                          b"Proxy-Authenticate: Basic realm=\"FreeSCP IT\"\r\n"
                          b"Connection: close\r\n\r\n"
                      )
                      return
                  host, port = parse_authority(authority)
                  upstream = socket.create_connection((host, port), timeout=10.0)
                  client.sendall(
                      b"HTTP/1.1 200 Connection Established\r\nConnection: keep-alive\r\n\r\n"
                  )
                  client.settimeout(None)
                  upstream.settimeout(None)
                  tunnel(client, upstream)
              except Exception:
                  try:
                      client.sendall(
                          b"HTTP/1.1 502 Bad Gateway\r\nConnection: close\r\n\r\n"
                      )
                  except Exception:
                      pass
              finally:
                  try:
                      if upstream is not None:
                          upstream.close()
                  except Exception:
                      pass
                  try:
                      client.close()
                  except Exception:
                      pass


          def main():
              server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind((BIND_HOST, BIND_PORT))
              server.listen(64)
              while True:
                  client, _ = server.accept()
                  thread = threading.Thread(target=handle, args=(client,), daemon=True)
                  thread.start()


          if __name__ == "__main__":
              main()
          PY

      - name: Write Telnet integration server
        run: |
          cat > /tmp/freescp_telnet_server.py <<'PY'
          import os
          import socket
          import threading

          BIND_HOST = "127.0.0.1"
          BIND_PORT = int(os.environ.get("IT_TELNET_PORT", "12323"))
          USERNAME = os.environ.get("IT_TELNET_USER", "freescp_it")
          PASSWORD = os.environ.get("IT_TELNET_PASS", "freescp_it_pass")

          IAC, DONT, DO, WONT, WILL, SB, SE = 255, 254, 253, 252, 251, 250, 240
          IAC_BYTE = b"\xff"
          SUPPORTED = {1, 3, 24, 31}  # ECHO, SGA, TTYPE, NAWS


          def negotiate(sock):
              """Offer ECHO/SGA and ask for TTYPE/NAWS, like a real server."""
              sock.sendall(
                  bytes(
                      [
                          IAC, DO, 24,
                          IAC, DO, 31,
                          IAC, WILL, 1,
                          IAC, WILL, 3,
                      ]
                  )
              )


          def negotiation_reply(command, option):
              supported = option in SUPPORTED
              if command == DO:
                  return bytes([IAC, WILL if supported else WONT, option])
              if command == WILL:
                  return bytes([IAC, DO if supported else DONT, option])
              return b""


          def consume(pending):
              """Strip IAC commands from a wire buffer.

              Returns ``(application data, negotiation replies, leftover)``.
              The leftover keeps an incomplete sequence for the next chunk.
              """
              app = bytearray()
              replies = bytearray()
              i = 0
              length = len(pending)
              while i < length:
                  if pending[i] != IAC:
                      end = pending.find(IAC_BYTE, i)
                      if end == -1:
                          app.extend(pending[i:])
                          i = length
                          break
                      app.extend(pending[i:end])
                      i = end
                      continue
                  if i + 1 >= length:
                      break
                  command = pending[i + 1]
                  if command == IAC:
                      app.append(IAC)
                      i += 2
                  elif command in (DO, DONT, WILL, WONT):
                      if i + 2 >= length:
                          break
                      replies.extend(negotiation_reply(command, pending[i + 2]))
                      i += 3
                  elif command == SB:
                      end = pending.find(bytes([IAC, SE]), i + 2)
                      if end == -1:
                          break
                      i = end + 2
                  else:
                      i += 2
              return bytes(app), bytes(replies), pending[i:]


          def handle(client):
              client.settimeout(30.0)
              negotiate(client)
              client.sendall(b"freescp telnet integration server\r\nlogin: ")
              pending = b""
              line = bytearray()
              stage = "login"
              while True:
                  try:
                      chunk = client.recv(4096)
                  except OSError:
                      break
                  if not chunk:
                      break
                  data, replies, pending = consume(pending + chunk)
                  if replies:
                      client.sendall(replies)
                  for byte in data:
                      if byte not in (10, 13):
                          line.append(byte)
                          continue
                      completed = bytes(line).strip()
                      line.clear()
                      if not completed:
                          continue
                      if stage == "login":
                          if completed == USERNAME.encode():
                              client.sendall(b"\r\nPassword: ")
                              stage = "password"
                          else:
                              client.sendall(b"\r\nlogin: ")
                      elif stage == "password":
                          if completed == PASSWORD.encode():
                              client.sendall(
                                  b"\r\nwelcome to the freescp telnet integration server\r\n"
                              )
                              stage = "shell"
                          else:
                              client.sendall(b"\r\nLogin incorrect\r\nlogin: ")
                              stage = "login"
                      else:
                          client.sendall(b"\r\n" + completed + b"\r\n")
              client.close()


          def main():
              server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              server.bind((BIND_HOST, BIND_PORT))
              server.listen(64)
              while True:
                  client, _ = server.accept()
                  threading.Thread(target=handle, args=(client,), daemon=True).start()


          if __name__ == "__main__":
              main()
          PY

      - name: Test (Linux, Telnet integration)
        if: runner.os == 'Linux'
        env:
          FREESCP_IT_TELNET_HOST: 127.0.0.1
          FREESCP_IT_TELNET_PORT: "12323"
          FREESCP_IT_TELNET_USER: freescp_it
          FREESCP_IT_TELNET_PASS: freescp_it_pass
          FREESCP_IT_TELNET_EXPECT_LOGIN: "1"
        run: |
          if [[ ! -f crates/freescp-core/tests/telnet_integration.rs ]]; then
            echo "crates/freescp-core/tests/telnet_integration.rs not written yet (sibling workstream); skipping"
            exit 0
          fi
          set -euo pipefail
          IT_TELNET_PORT=12323 \
          IT_TELNET_USER=freescp_it \
          IT_TELNET_PASS=freescp_it_pass \
          python3 /tmp/freescp_telnet_server.py &
          TELNET_PID=$!
          trap 'kill "$TELNET_PID" 2>/dev/null || true; wait "$TELNET_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if nc -z 127.0.0.1 12323 >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if ! nc -z 127.0.0.1 12323 >/dev/null 2>&1; then
            echo "telnet integration server did not start"
            exit 1
          fi
          cargo test -p freescp-core --test telnet_integration

      - name: Test (Linux, with SOCKS5 proxy integration)
        if: runner.os == 'Linux'
        env:
          FREESCP_IT_SFTP_HOST: 127.0.0.1
          FREESCP_IT_SFTP_PORT: "2222"
          FREESCP_IT_SFTP_USER: freescp_it
          FREESCP_IT_SFTP_KEY: /tmp/freescp_it_linux_ed25519
          FREESCP_IT_REMOTE_BASE: /home/freescp_it/upload
        run: |
          if [[ ! -f crates/freescp-core/tests/sftp_integration.rs ]]; then
            echo "crates/freescp-core/tests/sftp_integration.rs not written yet (sibling workstream); skipping"
            exit 0
          fi
          set -euo pipefail

          ssh \
            -i /tmp/freescp_it_linux_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -N -D 127.0.0.1:1081 \
            -p 2222 freescp_it@127.0.0.1 &
          SOCKS_PID=$!
          trap 'kill "$SOCKS_PID" 2>/dev/null || true; wait "$SOCKS_PID" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/1081) >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          if ! (echo > /dev/tcp/127.0.0.1/1081) >/dev/null 2>&1; then
            echo "SOCKS5 proxy tunnel did not start"
            exit 1
          fi

          FREESCP_IT_PROXY_TYPE=socks5 \
          FREESCP_IT_PROXY_HOST=127.0.0.1 \
          FREESCP_IT_PROXY_PORT=1081 \
          cargo test -p freescp-core --test sftp_integration

      - name: Test (Linux, with HTTP CONNECT proxy integration)
        if: runner.os == 'Linux'
        env:
          FREESCP_IT_SFTP_HOST: 127.0.0.1
          FREESCP_IT_SFTP_PORT: "2222"
          FREESCP_IT_SFTP_USER: freescp_it
          FREESCP_IT_SFTP_KEY: /tmp/freescp_it_linux_ed25519
          FREESCP_IT_REMOTE_BASE: /home/freescp_it/upload
        run: |
          if [[ ! -f crates/freescp-core/tests/sftp_integration.rs ]]; then
            echo "crates/freescp-core/tests/sftp_integration.rs not written yet (sibling workstream); skipping"
            exit 0
          fi
          set -euo pipefail
          PROXY_PORT=18081
          PROXY_USER=freescp_proxy
          PROXY_PASS=freescp_proxy_pass

          IT_HTTP_PROXY_PORT="${PROXY_PORT}" \
          IT_HTTP_PROXY_USER="${PROXY_USER}" \
          IT_HTTP_PROXY_PASS="${PROXY_PASS}" \
          python3 /tmp/freescp_http_connect_proxy.py &
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true; wait "$PROXY_PID" 2>/dev/null || true' EXIT

          for i in {1..40}; do
            if nc -z 127.0.0.1 "${PROXY_PORT}" >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if ! nc -z 127.0.0.1 "${PROXY_PORT}" >/dev/null 2>&1; then
            echo "HTTP CONNECT proxy did not start"
            exit 1
          fi

          FREESCP_IT_PROXY_TYPE=http \
          FREESCP_IT_PROXY_HOST=127.0.0.1 \
          FREESCP_IT_PROXY_PORT="${PROXY_PORT}" \
          FREESCP_IT_PROXY_USER="${PROXY_USER}" \
          FREESCP_IT_PROXY_PASS="${PROXY_PASS}" \
          cargo test -p freescp-core --test sftp_integration

      - name: Test (Linux, with SSH jump integration)
        if: runner.os == 'Linux'
        env:
          FREESCP_IT_SFTP_HOST: 127.0.0.1
          FREESCP_IT_SFTP_PORT: "2222"
          FREESCP_IT_SFTP_USER: freescp_it
          FREESCP_IT_SFTP_KEY: /tmp/freescp_it_linux_ed25519
          FREESCP_IT_REMOTE_BASE: /home/freescp_it/upload
        run: |
          if [[ ! -f crates/freescp-core/tests/sftp_integration.rs ]]; then
            echo "crates/freescp-core/tests/sftp_integration.rs not written yet (sibling workstream); skipping"
