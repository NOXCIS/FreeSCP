[workspace]
resolver = "2"
members = ["crates/freescp-core", "crates/freescp-app", "crates/freescp-cli"]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# russh 0.63 bundles key handling (russh::keys) - no separate russh-keys crate.
russh = "0.63"
russh-sftp = "3"
suppaftp = { version = "6", features = ["rustls", "deprecated"] }
smb2 = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "gzip"] }
futures-util = "0.3"
quick-xml = "0.37"
tokio-socks = "0.5"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
dirs = "6"
walkdir = "2"
filetime = "0.2"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
slint = { version = "1.17", features = ["gettext"] }
slint-build = "1.17"
rfd = "0.15"
sys-locale = "0.3"
arboard = "3"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
dialoguer = "0.12"
indicatif = "0.18"
rustyline = "18"
crossterm = "0.29"
