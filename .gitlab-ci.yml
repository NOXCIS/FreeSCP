# FreeSCP GitLab CI.
#
# Releases: the binaries are built in Docker and published to GitHub Releases
# by .github/workflows/release.yml (GitHub Actions provides the docker builder
# and QEMU needed for the full 6-target matrix). This pipeline mirrors a
# published GitHub release into a GitLab Release: it downloads the assets from
# the public GitHub release, verifies their checksums, uploads them to this
# project's generic package registry, and creates a GitLab Release linking
# them.
#
# The job runs when a v* tag is pushed and only succeeds once the matching
# GitHub release exists and carries all expected assets.
#
# NOTE: GitLab runs job scripts with /bin/sh (busybox ash on Alpine), so this
# file must stay POSIX sh — no bash arrays or bashisms. The release itself is
# created via the API instead of the `release:` keyword because asset link
# URLs need $VERSION, which YAML release fields cannot see.

stages:
  - release

mirror-github-release:
  stage: release
  image: alpine:3.20
  # The window below is deliberately generous: a cold release run (no cached
  # image layers or cargo registry) takes a while even with all six targets
  # building natively. The project build_timeout is set to 4h to match. retry
  # covers flaky downloads and restarts the wait if an attempt still runs out
  # of time.
  timeout: 3h 30m
  retry:
    max: 1
    when: always
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    GITHUB_REPO: "NOXCIS/FreeSCP"
    GIT_STRATEGY: none
  script:
    - apk add --no-cache curl jq
    - mkdir -p assets && cd assets
    - |
      V="${CI_COMMIT_TAG#v}"
      BASE="https://github.com/${GITHUB_REPO}/releases/download/${CI_COMMIT_TAG}"
      # Poll the public asset URL instead of the GitHub API: the API allows
      # only 60 unauthenticated requests/hour, which a polling loop would
      # exhaust long before the ~3h Docker/QEMU build finishes.
      echo "Waiting for the GitHub release ${CI_COMMIT_TAG} to publish assets..."
      UP=0
      for i in $(seq 1 240); do
        if curl -fsSLI -o /dev/null "${BASE}/SHA256SUMS"; then UP=1; break; fi
        echo "attempt ${i}: assets not published yet; waiting..."
        sleep 60
      done
      [ "${UP}" -eq 1 ] || { echo "GitHub release ${CI_COMMIT_TAG} did not appear in time"; exit 1; }
    - |
      V="${CI_COMMIT_TAG#v}"
      BASE="https://github.com/${GITHUB_REPO}/releases/download/${CI_COMMIT_TAG}"
      # Asset names are deterministic; download them all by URL. 8 packages
      # + their .sha256 files + SHA256SUMS = 17 assets in total.
      PKGS="FreeSCP-${V}-x86_64.AppImage \
        FreeSCP-${V}-aarch64.AppImage \
        FreeSCP-${V}-linux-x86_64.tar.gz \
        FreeSCP-${V}-linux-aarch64.tar.gz \
        FreeSCP-${V}-macos-x86_64-UNSIGNED.zip \
        FreeSCP-${V}-macos-arm64-UNSIGNED.zip \
        FreeSCP-${V}-windows-x86_64-UNSIGNED.zip \
        FreeSCP-${V}-windows-arm64-UNSIGNED.zip"
      MISSING=0
      for f in ${PKGS}; do
        for u in "${BASE}/${f}" "${BASE}/${f}.sha256"; do
          echo "Downloading ${u}"
          curl -fsSL -O "${u}" || { echo "ERROR: failed to download ${u}"; MISSING=1; }
        done
      done
      curl -fsSL -O "${BASE}/SHA256SUMS" || { echo "ERROR: failed to download SHA256SUMS"; MISSING=1; }
      [ "${MISSING}" -eq 0 ] || exit 1
      # Fail unless every downloaded artifact matches the published checksums.
      sha256sum -c SHA256SUMS
    - |
      # Upload every artifact to the generic package registry using the
      # built-in job token (no personal token required). 409 is tolerated so
      # job retries after a partial upload are idempotent.
      for f in *; do
        [ -f "${f}" ] || continue
        echo "Uploading ${f}"
        code=$(curl -sS -o /dev/null -w '%{http_code}' \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${f}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${CI_COMMIT_TAG}/${f}") \
          || { echo "ERROR: upload failed for ${f}"; exit 1; }
        case "${code}" in
          20*|409) echo "uploaded ${f} (HTTP ${code})" ;;
          *) echo "ERROR: unexpected HTTP ${code} for ${f}"; exit 1 ;;
        esac
      done
    - |
      # Create the GitLab Release via the Releases API (job tokens have full
      # access to it). $VERSION is needed for the asset link URLs, which the
      # YAML `release:` keyword cannot see. Tolerate 409 so retries are
      # idempotent when the release already exists.
      V="${CI_COMMIT_TAG#v}"
      REG="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${CI_COMMIT_TAG}"
      jq -n \
        --arg tag "${CI_COMMIT_TAG}" \
        --arg v "${V}" \
        --arg reg "${REG}" \
        '{
          tag_name: $tag,
          name: ("FreeSCP " + $v),
          description: ("FreeSCP " + $v + " — Linux, macOS and Windows packages (x86_64 + ARM64). Binaries are built in Docker on GitHub Actions and mirrored here. macOS and Windows packages are unsigned."),
          assets: {
            links: [
              {name: ("FreeSCP-" + $v + "-x86_64.AppImage (Linux x86_64)"),    url: ($reg + "/FreeSCP-" + $v + "-x86_64.AppImage")},
              {name: ("FreeSCP-" + $v + "-aarch64.AppImage (Linux ARM64)"),    url: ($reg + "/FreeSCP-" + $v + "-aarch64.AppImage")},
              {name: ("FreeSCP-" + $v + "-linux-x86_64.tar.gz"),               url: ($reg + "/FreeSCP-" + $v + "-linux-x86_64.tar.gz")},
              {name: ("FreeSCP-" + $v + "-linux-aarch64.tar.gz"),              url: ($reg + "/FreeSCP-" + $v + "-linux-aarch64.tar.gz")},
              {name: ("FreeSCP-" + $v + "-macos-x86_64-UNSIGNED.zip"),         url: ($reg + "/FreeSCP-" + $v + "-macos-x86_64-UNSIGNED.zip")},
              {name: ("FreeSCP-" + $v + "-macos-arm64-UNSIGNED.zip"),          url: ($reg + "/FreeSCP-" + $v + "-macos-arm64-UNSIGNED.zip")},
              {name: ("FreeSCP-" + $v + "-windows-x86_64-UNSIGNED.zip"),       url: ($reg + "/FreeSCP-" + $v + "-windows-x86_64-UNSIGNED.zip")},
              {name: ("FreeSCP-" + $v + "-windows-arm64-UNSIGNED.zip"),        url: ($reg + "/FreeSCP-" + $v + "-windows-arm64-UNSIGNED.zip")},
              {name: "SHA256SUMS",                                             url: ($reg + "/SHA256SUMS")}
            ]
          }
        }' > release.json
      code=$(curl -sS -o release-resp.json -w '%{http_code}' \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases") \
        || { echo "ERROR: release creation request failed"; exit 1; }
      case "${code}" in
        20*|409) echo "GitLab release published (HTTP ${code})" ;;
        *) echo "ERROR: release creation returned HTTP ${code}:"; cat release-resp.json; exit 1 ;;
      esac
