# FreeSCP GitLab CI.
#
# Releases: the binaries are built in Docker and published to GitHub Releases
# by .github/workflows/release.yml (GitHub Actions provides the docker builder
# and QEMU needed for the full 6-target matrix). This pipeline mirrors a
# published GitHub release into a GitLab Release: it downloads the assets from
# the public GitHub release, uploads them to this project's generic package
# registry, and creates a GitLab Release linking them.
#
# The job runs when a v* tag is pushed and only succeeds once the matching
# GitHub release exists and carries all expected assets.

stages:
  - release

mirror-github-release:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    GITHUB_REPO: "NOXCIS/FreeSCP"
    GIT_STRATEGY: none
  script:
    - apk add --no-cache curl jq
    - export VERSION="${CI_COMMIT_TAG#v}"
    - mkdir -p assets && cd assets
    - |
      AUTH=()
      if [ -n "${GITHUB_TOKEN:-}" ]; then
        AUTH=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
      fi
      TAG_URL="https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${CI_COMMIT_TAG}"
      # The GitHub release is produced by Actions after the Docker builds
      # finish, which can lag this tag-triggered job by an hour or more.
      echo "Waiting for the GitHub release ${CI_COMMIT_TAG} to publish assets..."
      ASSETS=""
      for i in $(seq 1 240); do
        ASSETS=$(curl -fsSL "${AUTH[@]}" "${TAG_URL}" | jq -r '.assets[].browser_download_url' 2>/dev/null || true)
        if [ -n "${ASSETS}" ]; then
          N=$(printf '%s\n' "${ASSETS}" | wc -l)
          if [ "${N}" -ge 17 ]; then break; fi
          echo "attempt ${i}: release exists with ${N} assets; waiting..."
        else
          echo "attempt ${i}: release not published yet; waiting..."
        fi
        sleep 60
      done
      test -n "${ASSETS}" || { echo "GitHub release ${CI_COMMIT_TAG} did not appear in time"; exit 1; }
      printf '%s\n' "${ASSETS}" > urls.txt
      test "$(wc -l < urls.txt)" -ge 17 || { echo "expected at least 17 assets, got: $(cat urls.txt)"; exit 1; }
      while IFS= read -r url; do
        echo "Downloading ${url}"
        curl -fsSL -O "${AUTH[@]}" "${url}"
      done < urls.txt
    - |
      # Upload every artifact to the generic package registry using the
      # built-in job token (no personal token required).
      for f in *.AppImage *.zip *.tar.gz *.sha256 SHA256SUMS; do
        [ -e "$f" ] || continue
        echo "Uploading ${f}"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "${f}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/${f}"
        echo
      done
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "FreeSCP $VERSION"
    description: "FreeSCP $VERSION — Linux, macOS and Windows packages (x86_64 + ARM64). Binaries are built in Docker on GitHub Actions and mirrored here. macOS and Windows packages are unsigned."
    assets:
      links:
        - name: "FreeSCP-$VERSION-x86_64.AppImage (Linux x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-x86_64.AppImage"
        - name: "FreeSCP-$VERSION-aarch64.AppImage (Linux ARM64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-aarch64.AppImage"
        - name: "FreeSCP-$VERSION-linux-x86_64.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-linux-x86_64.tar.gz"
        - name: "FreeSCP-$VERSION-linux-aarch64.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-linux-aarch64.tar.gz"
        - name: "FreeSCP-$VERSION-macos-x86_64-UNSIGNED.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-macos-x86_64-UNSIGNED.zip"
        - name: "FreeSCP-$VERSION-macos-arm64-UNSIGNED.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-macos-arm64-UNSIGNED.zip"
        - name: "FreeSCP-$VERSION-windows-x86_64-UNSIGNED.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-windows-x86_64-UNSIGNED.zip"
        - name: "FreeSCP-$VERSION-windows-arm64-UNSIGNED.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/FreeSCP-${VERSION}-windows-arm64-UNSIGNED.zip"
        - name: "SHA256SUMS"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/freescp/${VERSION}/SHA256SUMS"
